name: Build TemplePlus Korean 1.0.98

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-templeplus-korean.yml'
      - 'tools/apply_templeplus_cp949_patch.py'
      - 'tools/templeplus-1.0.98-korean-cp949.patch'

permissions:
  contents: read

jobs:
  build:
    name: Build Korean CP949 TemplePlus
    runs-on: windows-latest
    steps:
      - name: Checkout Korean patch repo
        uses: actions/checkout@v4
        with:
          path: krpatch

      - name: Checkout official TemplePlus v1.0.98
        uses: actions/checkout@v4
        with:
          repository: GrognardsFromHell/TemplePlus
          ref: v1.0.98
          path: templeplus

      - name: Set up NuGet
        uses: nuget/setup-nuget@v1

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Apply Korean legacy text patch
        shell: powershell
        run: |
          python krpatch/tools/apply_templeplus_cp949_patch.py templeplus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd templeplus
          git diff --check
          git diff -- Infrastructure/include/infrastructure/stringutil.h Infrastructure/stringutil.cpp TemplePlus/gamesystems/gamesystems.cpp TemplePlus/fonts/fonts_layout.cpp TemplePlus/ui/widgets/widget_content.cpp

      - name: Download and extract official dependencies
        working-directory: templeplus
        shell: powershell
        run: |
          curl.exe -L -o dependencies.7z https://github.com/GrognardsFromHell/Dependencies/releases/download/v1.19/dependencies.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z x dependencies.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore NuGet packages
        working-directory: templeplus
        shell: powershell
        run: |
          nuget install Squirrel.Windows -OutputDirectory Squirrel -Verbosity Detailed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build patched TemplePlus
        working-directory: templeplus
        shell: cmd
        env:
          TEMPLEPLUS_VERSION: 1.0.98
          COMMIT_ID: KRCP949
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          msbuild TemplePlus.sln /p:Configuration=Release /p:Platform=Win32 /p:MSBuildDefines="_TP_VERSION=%TEMPLEPLUS_VERSION%;_TP_COMMIT=%COMMIT_ID%;TP_RELEASE_BUILD" /verbosity:minimal

      - name: Validate Korean patch in executable
        shell: powershell
        run: |
          python -c "from pathlib import Path; b=Path(r'templeplus/Release/TemplePlus.exe').read_bytes(); assert b'Korean text mode enabled (CP949)' in b; print('BINARY_PATCH_OK', len(b))"

      - name: Prepare test package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item templeplus/Release/TemplePlus.exe dist/TemplePlus.exe
          Copy-Item krpatch/tools/templeplus-1.0.98-korean-cp949.patch dist/SOURCE_PATCH.txt
          @'
          TemplePlus 1.0.98 Korean CP949 text-rendering test build

          Replace ONLY TemplePlus.exe in your existing app-1.0.98 directory after making a backup.
          Keep all existing tpdata/fonts and Korean font mapping files.

          Required game language:
          data/mes/language.mes -> {1}{ko}

          Test:
          - NPC mouse-over names
          - NPC bark / floating text
          - Party Pool legacy UI
          - Character sheet / legacy HUD text

          This is a test build, not an official TemplePlus release.
          '@ | Set-Content -Path dist/README_KOREAN_TEST.txt -Encoding UTF8

      - name: Upload patched executable
        uses: actions/upload-artifact@v4
        with:
          name: TemplePlus-1.0.98-Korean-CP949-Test
          path: dist/*
          if-no-files-found: error
