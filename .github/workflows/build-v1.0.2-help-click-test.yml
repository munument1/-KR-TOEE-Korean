name: Build v1.0.2 Korean Help Link Click Test

on:
  push:
    branches:
      - agent/minimal-cp949-exe
    paths:
      - ".github/workflows/build-v1.0.2-help-click-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout historical minimal Korean patch
        uses: actions/checkout@v4
        with:
          repository: munument1/-KR-TOEE-Korean
          ref: bf77e9530060621e3b3c2bfa38105ff759b86de1
          path: legacy_patch

      - name: Checkout official TemplePlus v1.0.98
        uses: actions/checkout@v4
        with:
          repository: GrognardsFromHell/TemplePlus
          ref: v1.0.98
          path: templeplus

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2

      - name: Preserve upstream source encoding in historical patch helper
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path("legacy_patch/tools/apply_templeplus_cp949_patch.py")
          text = p.read_text(encoding="utf-8")

          old_patch_file = '''def patch_file(path: Path, transform):
              text = path.read_text(encoding="utf-8-sig")
              new_text = transform(text)
              if new_text == text:
                  raise RuntimeError(f"No changes made to {path}")
              path.write_text(new_text, encoding="utf-8", newline="\\n")
              print(f"patched {path}")
          '''
          new_patch_file = '''def read_source_text(path: Path):
              raw = path.read_bytes()
              try:
                  return raw.decode("utf-8-sig"), "utf-8"
              except UnicodeDecodeError:
                  return raw.decode("cp1252"), "cp1252"

          def patch_file(path: Path, transform):
              text, source_encoding = read_source_text(path)
              text = text.replace("\\r\\n", "\\n").replace("\\r", "\\n")
              new_text = transform(text)
              if new_text == text:
                  raise RuntimeError(f"No changes made to {path}")
              path.write_bytes(new_text.encode(source_encoding))
              print(f"patched {path} [{source_encoding}]")
          '''
          if old_patch_file not in text:
              raise SystemExit("historical patch_file function not found")
          text = text.replace(old_patch_file, new_patch_file, 1)

          old_expr = '(root / rel).read_text(encoding="utf-8")'
          if old_expr not in text:
              raise SystemExit("historical verification read expression not found")
          text = text.replace(old_expr, 'read_source_text(root / rel)[0]', 1)

          p.write_text(text, encoding="utf-8", newline="\n")
          print("PATCH_HELPER_ENCODING_OK")
          '@ | python -

      - name: Apply minimal CP949 patch
        shell: pwsh
        run: |
          python legacy_patch/tools/apply_templeplus_cp949_patch.py templeplus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore vanilla item long-description popup
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path("templeplus/TemplePlus/ui/ui_char.cpp")
          raw = p.read_bytes()
          try:
              text = raw.decode("utf-8-sig")
              enc = "utf-8"
          except UnicodeDecodeError:
              text = raw.decode("cp1252")
              enc = "cp1252"

          text = text.replace("\r\n", "\n").replace("\r", "\n")
          start_marker = "void UiCharHooks::LongDescriptionPopupCreate(objHndl item)\n{\n"
          end_marker = "\nvoid UiCharHooks::TotalWeightOutputBtnTooltip"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("LongDescriptionPopupCreate start not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("LongDescriptionPopupCreate end not found")

          replacement = '''void UiCharHooks::LongDescriptionPopupCreate(objHndl item)
          {
              temple::GetRef<void(__cdecl)(objHndl)>(0x10144400)(item);
          }
          '''
          text = text[:start] + replacement + text[end:]

          hook_line = "\treplaceFunction(0x10144400, LongDescriptionPopupCreate);\n"
          if hook_line not in text:
              raise SystemExit("Long-description replacement hook not found")
          text = text.replace(hook_line, "", 1)
          p.write_bytes(text.encode(enc))
          print("LONG_DESCRIPTION_VANILLA_POPUP_RESTORED")
          '@ | python -

      - name: Add CP949-aware help link hit testing
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path("templeplus/TemplePlus/gamesystems/d20/d20_help.cpp")
          raw = p.read_bytes()
          try:
              text = raw.decode("utf-8-sig")
              enc = "utf-8"
          except UnicodeDecodeError:
              text = raw.decode("cp1252")
              enc = "cp1252"
          text = text.replace("\r\n", "\n").replace("\r", "\n")

          include_anchor = '#include "d20_race.h"\n'
          include_extra = '''#include "d20_race.h"
          #include "ui/ui.h"
          #include "tig/tig_msg.h"
          #include "tig/tig_font.h"
          #include <unordered_map>
          #include <vector>
          #include <algorithm>
          '''
          if include_anchor not in text:
              raise SystemExit("include anchor missing")
          text = text.replace(include_anchor, include_extra, 1)

          anchor = '''int HelpSystem::GetTAG_ROOT(){
              static int rootHash = ElfHash::Hash("TAG_ROOT");
              return rootHash;
          }
          '''
          if anchor not in text:
              raise SystemExit("GetTAG_ROOT anchor missing")

          fix_code = r'''

          // KR v1.0.2 help-link fix.
          // The CP949 patch renders/measures Korean through the new TTF path, while the
          // original scrollbox click hit-test still uses the legacy byte-glyph path.
          // Recalculate clickable link rectangles from the same CP949-aware Measure path.
          namespace {

          using KrHelpShowFn = void(__cdecl *)(int);
          using KrScrollboxMsgFn = BOOL(__cdecl *)(int, TigMsg*);

          static KrHelpShowFn krOrgHelpShow = nullptr;
          static KrScrollboxMsgFn krOrgScrollboxMsg = nullptr;
          static int krCurrentHelpTopic = 0;
          static bool krHelpBodiesLoaded = false;
          static std::unordered_map<int, std::string> krHelpBodies;

          struct KrHelpLinkSpan {
              size_t start = 0;
              size_t end = 0;
              int topicId = 0;
          };

          struct KrVisualLine {
              size_t start = 0;
              size_t end = 0;
              bool indented = false;
          };

          static int __cdecl KrHelpBodyParser(const TigTabParser*, int, char** columns) {
              if (!columns || !columns[0] || !columns[5] || !*columns[0]) {
                  return 0;
              }
              krHelpBodies[ElfHash::Hash(columns[0])] = columns[5];
              return 0;
          }

          static void KrLoadHelpFile(const char* path) {
              TigTabParser p;
              p.Init(KrHelpBodyParser);
              p.Open(path);
              p.Process();
              p.Close();
          }

          static void KrEnsureHelpBodiesLoaded() {
              if (krHelpBodiesLoaded) {
                  return;
              }
              krHelpBodiesLoaded = true;
              KrLoadHelpFile("mes\\help.tab");
              logger->info("KR_HELP_CLICK_FIX_ACTIVE: loaded {} help bodies", krHelpBodies.size());
          }

          static bool KrHasHighBytes(const std::string& s) {
              for (unsigned char ch : s) {
                  if (ch >= 0x80) {
                      return true;
                  }
              }
              return false;
          }

          static bool KrLooksLikeUtf8(const std::string& s) {
              bool sawHigh = false;
              for (size_t i = 0; i < s.size();) {
                  unsigned char c = (unsigned char)s[i];
                  if (c < 0x80) {
                      ++i;
                      continue;
                  }
                  sawHigh = true;
                  int need = 0;
                  if ((c & 0xE0) == 0xC0) need = 1;
                  else if ((c & 0xF0) == 0xE0) need = 2;
                  else if ((c & 0xF8) == 0xF0) need = 3;
                  else return false;
                  if (i + need >= s.size()) return false;
                  for (int j = 1; j <= need; ++j) {
                      unsigned char cc = (unsigned char)s[i + j];
                      if ((cc & 0xC0) != 0x80) return false;
                  }
                  i += need + 1;
              }
              return sawHigh;
          }

          static std::string KrTrimAscii(std::string s) {
              while (!s.empty() && (s.front() == ' ' || s.front() == '\t' || s.front() == '\r')) s.erase(s.begin());
              while (!s.empty() && (s.back() == ' ' || s.back() == '\t' || s.back() == '\r')) s.pop_back();
              return s;
          }

          static void KrAppendTopicLink(std::string& out, std::vector<KrHelpLinkSpan>& links,
                                        const std::string& label, int topicId) {
              auto start = out.size();
              out.append("@1");
              out.append(label);
              out.append("@0");
              auto end = out.size();
              if (topicId) {
                  links.push_back({start, end, topicId});
              }
          }

          static void KrAppendChildren(std::string& out, std::vector<KrHelpLinkSpan>& links,
                                       D20HelpTopic* topic, bool sorted) {
              if (!topic) return;
              std::vector<D20HelpTopic*> children;
              int childId = topic->siblingId;
              int guard = 0;
              while (childId && guard++ < 4096) {
                  auto child = HelpSystem::GetTopic(childId);
                  if (!child) break;
                  children.push_back(child);
                  childId = child->nextId;
              }
              for (int i = 0; i < topic->vChildrenSize; ++i) {
                  auto child = HelpSystem::GetTopic(topic->virtualChildren[i]);
                  if (child && std::find(children.begin(), children.end(), child) == children.end()) {
                      children.push_back(child);
                  }
              }
              if (sorted) {
                  std::sort(children.begin(), children.end(), [](D20HelpTopic* a, D20HelpTopic* b) {
                      if (!a || !a->title) return true;
                      if (!b || !b->title) return false;
                      return _stricmp(a->title, b->title) < 0;
                  });
              }
              for (auto child : children) {
                  if (!child || !child->title) continue;
                  KrAppendTopicLink(out, links, child->title, child->topicId);
                  out.push_back('\n');
              }
          }

          static void KrBuildDisplayText(int topicId, const std::string& raw,
                                         std::string& out, std::vector<KrHelpLinkSpan>& links) {
              out.clear();
              links.clear();
              // Vanilla help UI prepends two blank lines to topic body content.
              out.append("\n\n");
              auto topic = HelpSystem::GetTopic(topicId);

              for (size_t i = 0; i < raw.size();) {
                  if (raw.compare(i, 21, "[CMD_CHILDREN_SORTED]") == 0) {
                      KrAppendChildren(out, links, topic, true);
                      i += 21;
                      continue;
                  }
                  if (raw.compare(i, 14, "[CMD_CHILDREN]") == 0) {
                      KrAppendChildren(out, links, topic, false);
                      i += 14;
                      continue;
                  }
                  if (raw[i] == '~') {
                      auto mid = raw.find("~[", i + 1);
                      if (mid != std::string::npos) {
                          auto close = raw.find(']', mid + 2);
                          if (close != std::string::npos) {
                              auto label = raw.substr(i + 1, mid - i - 1);
                              auto target = KrTrimAscii(raw.substr(mid + 2, close - (mid + 2)));
                              int targetId = 0;
                              if (target.rfind("TAG_", 0) == 0) {
                                  targetId = ElfHash::Hash(target.c_str());
                              }
                              KrAppendTopicLink(out, links, label, targetId);
                              i = close + 1;
                              continue;
                          }
                      }
                  }
                  char ch = raw[i++];
                  if (ch == '\v') ch = '\n';
                  out.push_back(ch);
              }
          }

          static int KrMeasureRange(const TigTextStyle& style, const std::string& text,
                                    size_t start, size_t end, int* heightOut = nullptr) {
              if (end <= start) {
                  if (heightOut) *heightOut = 0;
                  return 0;
              }
              auto tmp = text.substr(start, end - start);
              TigFontMetrics metrics;
              metrics.text = tmp.c_str();
              metrics.width = 0;
              metrics.height = 0;
              tigFont.Measure(style, metrics);
              if (heightOut) *heightOut = metrics.height;
              return metrics.width;
          }

          static size_t KrNextByteChar(const std::string& text, size_t pos, size_t end) {
              if (pos >= end) return end;
              unsigned char c = (unsigned char)text[pos];
              if (c == '@' && pos + 1 < end && text[pos + 1] >= '0' && text[pos + 1] <= '9') {
                  return pos + 2;
              }
              // CP949/DBCS lead byte. Do not split a Korean glyph while wrapping.
              if (c >= 0x81 && pos + 1 < end) {
                  return pos + 2;
              }
              return pos + 1;
          }

          static std::vector<KrVisualLine> KrBuildVisualLines(const TigTextStyle& style,
                                                               const std::string& text, int width) {
              std::vector<KrVisualLine> result;
              size_t logicalStart = 0;
              while (logicalStart <= text.size()) {
                  auto nl = text.find('\n', logicalStart);
                  size_t logicalEnd = (nl == std::string::npos) ? text.size() : nl;
                  if (logicalStart == logicalEnd) {
                      result.push_back({logicalStart, logicalEnd, false});
                  } else {
                      size_t pos = logicalStart;
                      bool indented = false;
                      while (pos < logicalEnd) {
                          int available = width - (indented ? 15 : 0);
                          size_t cur = pos;
                          size_t best = pos;
                          size_t lastSpace = std::string::npos;
                          while (cur < logicalEnd) {
                              auto next = KrNextByteChar(text, cur, logicalEnd);
                              if (text[cur] == ' ' || text[cur] == '\t') lastSpace = next;
                              if (KrMeasureRange(style, text, pos, next) > available) {
                                  if (lastSpace != std::string::npos && lastSpace > pos) best = lastSpace;
                                  else if (cur > pos) best = cur;
                                  else best = next;
                                  break;
                              }
                              best = next;
                              cur = next;
                          }
                          if (best <= pos) best = KrNextByteChar(text, pos, logicalEnd);
                          result.push_back({pos, best, indented});
                          pos = best;
                          while (pos < logicalEnd && (text[pos] == ' ' || text[pos] == '\t')) ++pos;
                          indented = true;
                      }
                  }
                  if (nl == std::string::npos) break;
                  logicalStart = nl + 1;
              }
              return result;
          }

          static int KrGetScrollValue(LgcyWindow* body) {
              if (!body) return 0;
              for (uint32_t i = 0; i < body->childrenCount && i < 128; ++i) {
                  auto child = uiManager->GetWidget(body->children[i]);
                  if (child && child->IsScrollBar()) {
                      auto sb = (LgcyScrollBar*)child;
                      auto value = sb->GetY();
                      return value < 0 ? 0 : value;
                  }
              }
              return 0;
          }

          static bool KrTryHandleHelpClick(int widId, TigMsg* msg) {
              if (!msg || msg->type != TigMsgType::WIDGET ||
                  !msg->IsWidgetEvent(TigMsgWidgetEvent::MouseReleased) || !krCurrentHelpTopic) {
                  return false;
              }

              auto body = uiManager->GetWindow(widId);
              if (!body) return false;

              auto helpBodyId = temple::GetRef<int>(0x10BE2E78);
              auto helpWndId = temple::GetRef<int>(0x10BE2E74);
              if (widId != helpBodyId && body->parentId != helpWndId) {
                  return false;
              }

              KrEnsureHelpBodiesLoaded();
              auto it = krHelpBodies.find(krCurrentHelpTopic);
              if (it == krHelpBodies.end()) return false;
              const auto& raw = it->second;
              if (!KrHasHighBytes(raw) || KrLooksLikeUtf8(raw)) {
                  return false;
              }

              std::string display;
              std::vector<KrHelpLinkSpan> links;
              KrBuildDisplayText(krCurrentHelpTopic, raw, display, links);
              if (links.empty()) return false;

              TigTextStyle style;
              style.flags = TTSF_DROP_SHADOW;
              style.kerning = 1;
              style.tracking = 3;
              style.field4c = 15;

              tigFont.PushFont("arial-10", 10, true);
              TigFontMetrics heightMetrics;
              heightMetrics.text = "TEST";
              tigFont.Measure(style, heightMetrics);
              int lineHeight = heightMetrics.height > 0 ? heightMetrics.height : 13;
              int textWidth = body->width > 20 ? (int)body->width - 20 : 380;
              if (textWidth > 380) textWidth = 380;
              auto lines = KrBuildVisualLines(style, display, textWidth);

              auto wmsg = (TigMsgWidget*)msg;
              int textX = body->x;
              int textY = body->y + 16;
              int textHeight = body->height > 24 ? (int)body->height - 24 : 374;
              int mx = (int)wmsg->x;
              int my = (int)wmsg->y;
              if (mx < textX || mx >= textX + textWidth || my < textY || my >= textY + textHeight) {
                  tigFont.PopFont();
                  return false;
              }

              int firstLine = KrGetScrollValue(body);
              int clickedLine = firstLine + (my - textY) / lineHeight;
              if (clickedLine < 0 || clickedLine >= (int)lines.size()) {
                  tigFont.PopFont();
                  return false;
              }

              const auto& line = lines[clickedLine];
              int indent = line.indented ? 15 : 0;
              for (const auto& link : links) {
                  if (link.end <= line.start || link.start >= line.end || !link.topicId) continue;
                  size_t segStart = std::max(link.start, line.start);
                  size_t segEnd = std::min(link.end, line.end);
                  int left = indent + KrMeasureRange(style, display, line.start, segStart);
                  int right = indent + KrMeasureRange(style, display, line.start, segEnd);
                  if (right < left) std::swap(left, right);
                  int relX = mx - textX;
                  if (relX >= left - 5 && relX <= right + 5) {
                      auto targetId = link.topicId;
                      tigFont.PopFont();
                      logger->info("KR_HELP_CLICK_FIX: topic {} -> {}", krCurrentHelpTopic, targetId);
                      helpSys.PresentWikiHelpWindow(targetId);
                      return true;
                  }
              }

              tigFont.PopFont();
              return false;
          }

          static void __cdecl KrHelpShowHook(int topicId) {
              krCurrentHelpTopic = topicId;
              krOrgHelpShow(topicId);
          }

          static BOOL __cdecl KrScrollboxMsgHook(int widId, TigMsg* msg) {
              if (KrTryHandleHelpClick(widId, msg)) {
                  return TRUE;
              }
              return krOrgScrollboxMsg(widId, msg);
          }

          class KrHelpClickFix : TempleFix {
          public:
              void apply() override {
                  krOrgHelpShow = replaceFunction<void(__cdecl)(int)>(0x100E6CF0, KrHelpShowHook);
                  krOrgScrollboxMsg = replaceFunction<BOOL(__cdecl)(int, TigMsg*)>(0x1018D720, KrScrollboxMsgHook);
              }
          } krHelpClickFix;

          } // namespace
          '''

          text = text.replace(anchor, anchor + fix_code, 1)
          p.write_bytes(text.encode(enc))
          print("KR_HELP_CLICK_FIX_SOURCE_ADDED")
          '@ | python -

      - name: Validate source delta
        shell: pwsh
        run: |
          Push-Location templeplus
          $changed = @(git diff --name-only)
          $allowed = @(
            'Infrastructure/include/infrastructure/stringutil.h',
            'Infrastructure/stringutil.cpp',
            'TemplePlus/gamesystems/gamesystems.cpp',
            'TemplePlus/fonts/fonts_layout.cpp',
            'TemplePlus/ui/widgets/widget_content.cpp',
            'TemplePlus/ui/ui_char.cpp',
            'TemplePlus/gamesystems/d20/d20_help.cpp'
          )
          Write-Host 'Changed files:'
          $changed | ForEach-Object { Write-Host "  $_" }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            Write-Error ('Unexpected source changes: ' + ($unexpected -join ', '))
            exit 2
          }
          if ($changed.Count -ne 7) {
            Write-Error "Expected exactly 7 changed source files, got $($changed.Count)"
            exit 3
          }
          if (-not (Select-String -Path TemplePlus/gamesystems/d20/d20_help.cpp -SimpleMatch 'KR_HELP_CLICK_FIX_ACTIVE')) {
            Write-Error 'Help-click source marker missing'
            exit 4
          }
          Pop-Location

      - name: Download official dependencies
        working-directory: templeplus
        shell: pwsh
        run: |
          curl.exe -L -o dependencies.7z https://github.com/GrognardsFromHell/Dependencies/releases/download/v1.19/dependencies.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z x dependencies.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore NuGet packages
        working-directory: templeplus
        shell: pwsh
        run: |
          nuget install Squirrel.Windows -OutputDirectory Squirrel -Verbosity Detailed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build TemplePlus
        working-directory: templeplus
        shell: cmd
        env:
          TEMPLEPLUS_VERSION: 1.0.98
          COMMIT_ID: KRCP949HELP
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath`) do set VSROOT=%%i
          if not defined VSROOT exit /b 10
          call "%VSROOT%\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b %errorlevel%
          msbuild TemplePlus.sln /p:Configuration=Release /p:Platform=Win32 /p:MSBuildDefines="_TP_VERSION=%TEMPLEPLUS_VERSION%;_TP_COMMIT=%COMMIT_ID%;TP_RELEASE_BUILD" /verbosity:minimal

      - name: Validate executable
        shell: pwsh
        run: |
          $exe = 'templeplus/Release/TemplePlus.exe'
          if (-not (Test-Path $exe)) { throw 'TemplePlus.exe missing' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains('Korean text mode enabled (CP949)')) {
            throw 'Minimal Korean marker missing from executable'
          }
          if (-not $ascii.Contains('KR_HELP_CLICK_FIX_ACTIVE')) {
            throw 'Help-click marker missing from executable'
          }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-Item $exe | Format-List Name,Length

      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: TOEE_v1.0.2_HELP_CLICK_EXE_TEST
          path: templeplus/Release/TemplePlus.exe
          if-no-files-found: error
