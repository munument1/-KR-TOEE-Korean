name: Build v1.0.2 Help Link Offset Fix

on:
  push:
    branches:
      - agent/minimal-cp949-exe
    paths:
      - ".github/workflows/build-v1.0.2-help-link-offset-fix.yml"
      - "tools/apply_v102_help_link_cp949_offset_fix.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout historical minimal Korean patch
        uses: actions/checkout@v4
        with:
          repository: munument1/-KR-TOEE-Korean
          ref: bf77e9530060621e3b3c2bfa38105ff759b86de1
          path: legacy_patch

      - name: Checkout official TemplePlus v1.0.98
        uses: actions/checkout@v4
        with:
          repository: GrognardsFromHell/TemplePlus
          ref: v1.0.98
          path: templeplus

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2

      - name: Make historical CP949 helper preserve source encoding
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("legacy_patch/tools/apply_templeplus_cp949_patch.py")
          text = p.read_text(encoding="utf-8")
          old = '''def patch_file(path: Path, transform):
              text = path.read_text(encoding="utf-8-sig")
              new_text = transform(text)
              if new_text == text:
                  raise RuntimeError(f"No changes made to {path}")
              path.write_text(new_text, encoding="utf-8", newline="\\n")
              print(f"patched {path}")
          '''
          new = '''def read_source_text(path: Path):
              raw = path.read_bytes()
              try:
                  return raw.decode("utf-8-sig"), "utf-8"
              except UnicodeDecodeError:
                  return raw.decode("cp1252"), "cp1252"

          def patch_file(path: Path, transform):
              text, source_encoding = read_source_text(path)
              text = text.replace("\\r\\n", "\\n").replace("\\r", "\\n")
              new_text = transform(text)
              if new_text == text:
                  raise RuntimeError(f"No changes made to {path}")
              path.write_bytes(new_text.encode(source_encoding))
              print(f"patched {path} [{source_encoding}]")
          '''
          if old not in text:
              raise SystemExit("historical patch_file function not found")
          text = text.replace(old, new, 1)
          old_read = '(root / rel).read_text(encoding="utf-8")'
          if old_read not in text:
              raise SystemExit("historical verification read expression not found")
          text = text.replace(old_read, 'read_source_text(root / rel)[0]', 1)
          p.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Apply minimal CP949 patch
        shell: pwsh
        run: |
          python legacy_patch/tools/apply_templeplus_cp949_patch.py templeplus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply long-description and help-link offset fix
        shell: pwsh
        run: |
          python current/tools/apply_v102_help_link_cp949_offset_fix.py templeplus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate source delta
        shell: pwsh
        run: |
          Push-Location templeplus
          $changed = @(git diff --name-only)
          $allowed = @(
            'Infrastructure/include/infrastructure/stringutil.h',
            'Infrastructure/stringutil.cpp',
            'TemplePlus/gamesystems/gamesystems.cpp',
            'TemplePlus/fonts/fonts_layout.cpp',
            'TemplePlus/ui/widgets/widget_content.cpp',
            'TemplePlus/ui/ui_char.cpp',
            'TemplePlus/gamesystems/d20/d20_help.cpp'
          )
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw ('Unexpected source changes: ' + ($unexpected -join ', ')) }
          if ($changed.Count -ne 7) { throw "Expected 7 changed source files, got $($changed.Count)" }
          if (-not (Select-String -Path TemplePlus/gamesystems/d20/d20_help.cpp -SimpleMatch 'KrHelpCp949BytesToUtf16Units')) { throw 'Help link offset fix missing' }
          if (Select-String -Path TemplePlus/gamesystems/d20/d20_help.cpp -SimpleMatch 'KR_HELP_POSTPARSE') { throw 'Diagnostic code must not be present' }
          if (Select-String -Path TemplePlus/gamesystems/d20/d20_help.cpp -SimpleMatch 'KR_HELP_CLICK_FIX_ACTIVE') { throw 'Unsafe click hook must not be present' }
          if (Select-String -Path TemplePlus/ui/ui_char.cpp -SimpleMatch 'replaceFunction(0x10144400, LongDescriptionPopupCreate);') { throw 'Long-description replacement hook still present' }
          Pop-Location

      - name: Download official dependencies
        working-directory: templeplus
        shell: pwsh
        run: |
          curl.exe -L -o dependencies.7z https://github.com/GrognardsFromHell/Dependencies/releases/download/v1.19/dependencies.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z x dependencies.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore NuGet packages
        working-directory: templeplus
        shell: pwsh
        run: |
          nuget install Squirrel.Windows -OutputDirectory Squirrel -Verbosity Detailed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build TemplePlus
        working-directory: templeplus
        shell: cmd
        env:
          TEMPLEPLUS_VERSION: 1.0.98
          COMMIT_ID: KRCP949HLFIX
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath`) do set VSROOT=%%i
          if not defined VSROOT exit /b 10
          call "%VSROOT%\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b %errorlevel%
          msbuild TemplePlus.sln /p:Configuration=Release /p:Platform=Win32 /p:MSBuildDefines="_TP_VERSION=%TEMPLEPLUS_VERSION%;_TP_COMMIT=%COMMIT_ID%;TP_RELEASE_BUILD" /verbosity:minimal

      - name: Validate executable
        shell: pwsh
        run: |
          $exe = 'templeplus/Release/TemplePlus.exe'
          if (-not (Test-Path $exe)) { throw 'TemplePlus.exe missing' }
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if (-not $ascii.Contains('Korean text mode enabled (CP949)')) { throw 'CP949 marker missing' }
          # The optimized release binary is not required to retain the C++ helper symbol name.
          # Source validation above already verifies that the narrow help offset fix was applied.
          if ($ascii.Contains('KR_HELP_POSTPARSE')) { throw 'Diagnostic marker present' }
          if ($ascii.Contains('KR_HELP_CLICK_FIX_ACTIVE')) { throw 'Unsafe help click marker present' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-Item $exe | Format-List Name,Length

      - name: Upload fixed executable
        uses: actions/upload-artifact@v4
        with:
          name: TOEE_v1.0.2_HELP_LINK_OFFSET_FIX_EXE
          path: templeplus/Release/TemplePlus.exe
          if-no-files-found: error
