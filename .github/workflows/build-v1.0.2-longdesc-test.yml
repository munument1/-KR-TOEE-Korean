name: Build v1.0.2 Long Description Test

on:
  push:
    branches:
      - agent/minimal-cp949-exe
    paths:
      - ".github/workflows/build-v1.0.2-longdesc-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout historical minimal Korean patch
        uses: actions/checkout@v4
        with:
          repository: munument1/-KR-TOEE-Korean
          ref: bf77e9530060621e3b3c2bfa38105ff759b86de1
          path: legacy_patch

      - name: Checkout official TemplePlus v1.0.98
        uses: actions/checkout@v4
        with:
          repository: GrognardsFromHell/TemplePlus
          ref: v1.0.98
          path: templeplus

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2

      - name: Preserve upstream source encoding in historical patch helper
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path("legacy_patch/tools/apply_templeplus_cp949_patch.py")
          text = p.read_text(encoding="utf-8")

          old_patch_file = '''def patch_file(path: Path, transform):
              text = path.read_text(encoding="utf-8-sig")
              new_text = transform(text)
              if new_text == text:
                  raise RuntimeError(f"No changes made to {path}")
              path.write_text(new_text, encoding="utf-8", newline="\\n")
              print(f"patched {path}")
          '''
          new_patch_file = '''def read_source_text(path: Path):
              raw = path.read_bytes()
              try:
                  return raw.decode("utf-8-sig"), "utf-8"
              except UnicodeDecodeError:
                  return raw.decode("cp1252"), "cp1252"

          def patch_file(path: Path, transform):
              text, source_encoding = read_source_text(path)
              text = text.replace("\\r\\n", "\\n").replace("\\r", "\\n")
              new_text = transform(text)
              if new_text == text:
                  raise RuntimeError(f"No changes made to {path}")
              path.write_bytes(new_text.encode(source_encoding))
              print(f"patched {path} [{source_encoding}]")
          '''
          if old_patch_file not in text:
              raise SystemExit("historical patch_file function not found")
          text = text.replace(old_patch_file, new_patch_file, 1)

          old_expr = '(root / rel).read_text(encoding="utf-8")'
          if old_expr not in text:
              raise SystemExit("historical verification read expression not found")
          text = text.replace(old_expr, 'read_source_text(root / rel)[0]', 1)

          p.write_text(text, encoding="utf-8", newline="\n")
          print("PATCH_HELPER_ENCODING_OK")
          '@ | python -

      - name: Apply minimal CP949 patch
        shell: pwsh
        run: |
          python legacy_patch/tools/apply_templeplus_cp949_patch.py templeplus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore vanilla item long-description popup
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path("templeplus/TemplePlus/ui/ui_char.cpp")
          raw = p.read_bytes()
          try:
              text = raw.decode("utf-8-sig")
              enc = "utf-8"
          except UnicodeDecodeError:
              text = raw.decode("cp1252")
              enc = "cp1252"

          text = text.replace("\r\n", "\n").replace("\r", "\n")
          start_marker = "void UiCharHooks::LongDescriptionPopupCreate(objHndl item)\n{\n"
          end_marker = "\nvoid UiCharHooks::TotalWeightOutputBtnTooltip"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("LongDescriptionPopupCreate start not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("LongDescriptionPopupCreate end not found")

          replacement = '''void UiCharHooks::LongDescriptionPopupCreate(objHndl item)
          {
              // KR v1.0.2: use the original ToEE popup so the engine-generated
              // weapon/armor detail block (damage, critical range, proficiency, etc.) is preserved.
              temple::GetRef<void(__cdecl)(objHndl)>(0x10144400)(item);
          }
          '''
          text = text[:start] + replacement + text[end:]

          hook_line = "\treplaceFunction(0x10144400, LongDescriptionPopupCreate);\n"
          if hook_line not in text:
              raise SystemExit("Long-description replacement hook not found")
          text = text.replace(hook_line, "", 1)

          p.write_bytes(text.encode(enc))
          print("LONG_DESCRIPTION_VANILLA_POPUP_RESTORED")
          '@ | python -

      - name: Validate source delta
        shell: pwsh
        run: |
          Push-Location templeplus
          $changed = @(git diff --name-only)
          $allowed = @(
            'Infrastructure/include/infrastructure/stringutil.h',
            'Infrastructure/stringutil.cpp',
            'TemplePlus/gamesystems/gamesystems.cpp',
            'TemplePlus/fonts/fonts_layout.cpp',
            'TemplePlus/ui/widgets/widget_content.cpp',
            'TemplePlus/ui/ui_char.cpp'
          )
          Write-Host 'Changed files:'
          $changed | ForEach-Object { Write-Host "  $_" }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            Write-Error ('Unexpected source changes: ' + ($unexpected -join ', '))
            exit 2
          }
          if ($changed.Count -ne 6) {
            Write-Error "Expected exactly 6 changed source files, got $($changed.Count)"
            exit 3
          }
          if (Select-String -Path TemplePlus/ui/ui_char.cpp -SimpleMatch 'replaceFunction(0x10144400, LongDescriptionPopupCreate);') {
            Write-Error 'Long-description replacement hook is still present'
            exit 4
          }
          Pop-Location

      - name: Download official dependencies
        working-directory: templeplus
        shell: pwsh
        run: |
          curl.exe -L -o dependencies.7z https://github.com/GrognardsFromHell/Dependencies/releases/download/v1.19/dependencies.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z x dependencies.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore NuGet packages
        working-directory: templeplus
        shell: pwsh
        run: |
          nuget install Squirrel.Windows -OutputDirectory Squirrel -Verbosity Detailed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build TemplePlus
        working-directory: templeplus
        shell: cmd
        env:
          TEMPLEPLUS_VERSION: 1.0.98
          COMMIT_ID: KRCP949LD
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath`) do set VSROOT=%%i
          if not defined VSROOT exit /b 10
          echo Visual Studio: %VSROOT%
          call "%VSROOT%\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b %errorlevel%
          msbuild TemplePlus.sln /p:Configuration=Release /p:Platform=Win32 /p:MSBuildDefines="_TP_VERSION=%TEMPLEPLUS_VERSION%;_TP_COMMIT=%COMMIT_ID%;TP_RELEASE_BUILD" /verbosity:minimal

      - name: Validate executable
        shell: pwsh
        run: |
          $exe = 'templeplus/Release/TemplePlus.exe'
          if (-not (Test-Path $exe)) { throw 'TemplePlus.exe missing' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains('Korean text mode enabled (CP949)')) {
            throw 'Minimal Korean marker missing from executable'
          }
          if ($ascii.Contains('Korean UTF-8 legacy text mode enabled')) {
            throw 'Unexpected KRUTF8 marker found in executable'
          }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-Item $exe | Format-List Name,Length

      - name: Build v1.0.2 long-description test package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path input | Out-Null
          gh release download v1.0.1 `
            --repo munument1/-KR-TOEE-Korean `
            --pattern "TOEE_Korean_Patch_v1.0.1_STABLE_CP949_20260813.zip" `
            --dir input
          $base = Get-ChildItem input -Filter *.zip | Select-Object -First 1
          if (-not $base) { throw 'v1.0.1 base release ZIP missing' }

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Expand-Archive -LiteralPath $base.FullName -DestinationPath package -Force
          Copy-Item templeplus/Release/TemplePlus.exe package/TEMPLEPLUS_FOLDER/TemplePlus.exe -Force

          @'
          TOEE v1.0.2 롱소드 상세창 수치 복원 테스트판

          기준:
          - 공식 TemplePlus v1.0.98 + 기존 최소 CP949 한글 패치
          - 전투/AI/action sequence/rules 로직은 수정하지 않음
          - ui_char.cpp의 아이템 long-description popup 경로만 원본 ToEE 방식으로 복원

          확인할 것:
          1. 롱소드 Shift+클릭/상세 설명창에 기본 설명뿐 아니라 다음 동적 수치가 다시 표시되는지
             - 명중 보너스
             - 피해량
             - 피해 유형
             - 치명타 범위/배수
             - 무기 숙련
          2. 마법/강화/제작 무기에서도 상세창이 정상적으로 열리는지
          3. 일반 물리 공격 및 롤 히스토리 회귀가 없는지

          이 빌드는 테스트용입니다.
          '@ | Set-Content package/README_v1.0.2_LONGDESC_TEST.txt -Encoding UTF8

          $out = 'TOEE_Korean_Patch_v1.0.2_LONGDESC_EXE_TEST_20260815.zip'
          Compress-Archive -Path package/* -DestinationPath $out -CompressionLevel Optimal
          Get-FileHash $out -Algorithm SHA256 | Format-List
          Get-Item $out | Format-List Name,Length

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TOEE_v1.0.2_LONGDESC_EXE_TEST
          path: |
            templeplus/Release/TemplePlus.exe
            TOEE_Korean_Patch_v1.0.2_LONGDESC_EXE_TEST_20260815.zip
          if-no-files-found: error
