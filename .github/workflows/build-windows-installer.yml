name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/toee_korean_installer_gui.pyw"
      - "tools/toee_apply_korean_translation.py"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name TOEE_Korean_Installer `
            --paths tools `
            tools/toee_korean_installer_gui.pyw

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOEE_Korean_Installer_Windows
          path: dist/TOEE_Korean_Installer.exe
          if-no-files-found: error
