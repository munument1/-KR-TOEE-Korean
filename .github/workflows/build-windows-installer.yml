name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/toee_korean_installer_gui.pyw"
      - "tools/toee_apply_korean_translation.py"
      - "tools/toee_font_bundle_hook.py"
      - "font/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The four TTFs are vendored in font/tpdata/fonts and must match the
      # approved user-provided binaries before they are embedded in the EXE.
      - name: Validate bundled fonts
        shell: pwsh
        run: |
          $fonts = @{
            "font/tpdata/fonts/NanumBarunGothic.ttf" = "9b872773134e2e4d8c0b17021266786576db06c843ede0d0b523b214a450756c"
            "font/tpdata/fonts/NanumBarunGothicBold.ttf" = "39bba4cd9bd2986143825c8654abbb62443914ab33b346c0c929a916f5d98bf2"
            "font/tpdata/fonts/GraceSerif-Regular.ttf" = "33eb8227c4ecd0cfa4e4ec18d9f448a9530dfc36bb8034bf3b409b572aba64d1"
            "font/tpdata/fonts/GraceSerif-Bold.ttf" = "bbdc46f95144d4705c03b2b93da43464adc71ad8c3519702c7e0f04ae8b75d25"
          }
          foreach ($entry in $fonts.GetEnumerator()) {
            if (-not (Test-Path $entry.Key)) {
              throw "Missing required font: $($entry.Key)"
            }
            $actual = (Get-FileHash -Algorithm SHA256 $entry.Key).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key) expected=$($entry.Value) actual=$actual"
            }
            Write-Host "OK $($entry.Key) $actual"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name TOEE_Korean_Installer `
            --paths tools `
            --runtime-hook tools/toee_font_bundle_hook.py `
            --add-data "font/tpdata;resources/font/tpdata" `
            tools/toee_korean_installer_gui.pyw

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOEE_Korean_Installer_Windows
          path: dist/TOEE_Korean_Installer.exe
          if-no-files-found: error
